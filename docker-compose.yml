name: keitaro-wrapper

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wrapper
      POSTGRES_PASSWORD: wrapper
      POSTGRES_DB: wrapper
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrapper -d wrapper"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
